version: '3.8'

services:
  # Django REST Framework Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gharsathi_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY:?Set a strong Django SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:?Set explicit production hostnames}
      - POSTGRES_DB=${POSTGRES_DB:-gharsathi}
      - POSTGRES_USER=${POSTGRES_USER:-gharsathi_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set a strong PostgreSQL password}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/1}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - backend_static:/app/staticfiles
      - backend_data:/app

  # Redis In-Memory Datastore & Django Channels Layer
  redis:
    image: redis:7-alpine
    container_name: gharsathi_redis
    restart: unless-stopped

  # React + Vite Production Nginx Frontend Service
  frontend:
    build:
      context: ./GharSathi_React
      dockerfile: Dockerfile
    container_name: gharsathi_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
      - "80:80"
    depends_on:
      - backend

  # PostgreSQL Relational Database Service
  db:
    image: postgres:15-alpine
    container_name: gharsathi_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gharsathi}
      POSTGRES_USER: ${POSTGRES_USER:-gharsathi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gharsathi_secure_pwd_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gharsathi_user} -d ${POSTGRES_DB:-gharsathi}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  backend_static:
  backend_data:
