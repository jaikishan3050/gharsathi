services:
  # ============================================================================
  # 1. Django REST Framework + Daphne ASGI Backend Web Service
  # ============================================================================
  - type: web
    name: gharsathi-backend
    env: python
    region: singapore
    plan: starter
    rootDir: backend
    autoDeploy: true
    healthCheckPath: /api/services/
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate --noinput
    startCommand: daphne -b 0.0.0.0 -p $PORT gharsathi_backend.asgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "localhost,127.0.0.1,.onrender.com,.web.app,.firebaseapp.com,gharsathi.in,www.gharsathi.in,bookgharsathi.in,www.bookgharsathi.in"
      - key: DATABASE_URL
        fromDatabase:
          name: gharsathi-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: gharsathi-redis
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: "https://gharsathi-in.web.app,https://gharsathi-in.firebaseapp.com,https://gharsathi.in,https://www.gharsathi.in,https://bookgharsathi.in,https://www.bookgharsathi.in,http://localhost:5173"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://gharsathi-in.web.app,https://gharsathi-in.firebaseapp.com,https://gharsathi.in,https://www.gharsathi.in,https://bookgharsathi.in,https://www.bookgharsathi.in,https://*.onrender.com"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: ADMIN_BOOTSTRAP_USERNAME
        sync: false
      - key: ADMIN_BOOTSTRAP_EMAIL
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
      - key: SMS_PROVIDER
        value: "website_popup"

  # ============================================================================
  # 2. Redis In-Memory Datastore for Django Channels & WebSockets
  # ============================================================================
  - type: redis
    name: gharsathi-redis
    region: singapore
    plan: starter
    ipAllowList: [] # internal access only

databases:
  # ============================================================================
  # 3. Managed PostgreSQL Database
  # ============================================================================
  - name: gharsathi-postgres
    region: singapore
    plan: starter
    databaseName: gharsathi
    user: gharsathi_user
