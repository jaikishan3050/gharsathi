name: Ghar Sathi CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  DJANGO_SETTINGS_MODULE: gharsathi_backend.settings
  SECRET_KEY: django-insecure-gharsathi-ci-cd-test-key-2026
  DEBUG: "True"
  ALLOWED_HOSTS: "localhost,127.0.0.1,*"
  DATABASE_URL: "sqlite:///test.db"
  SMS_PROVIDER: "sandbox"
  FAST2SMS_API_KEY: "sandbox"
  RAZORPAY_KEY_ID: "rzp_test_gharsathi_demo"
  RAZORPAY_KEY_SECRET: "gharsathi_sandbox_secret_key_12345"

jobs:
  # ============================================================================
  # 1. Django Backend Unit Testing & Verification
  # ============================================================================
  backend-test:
    name: Backend PyTest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Django System Checks
        working-directory: backend
        run: |
          python manage.py check

      - name: Run PyTest Test Suite (Financial & Operational Flows)
        working-directory: backend
        run: |
          pytest -v

  # ============================================================================
  # 2. React + Vite Frontend Testing & Static Asset Build
  # ============================================================================
  frontend-build-and-test:
    name: Frontend Vitest & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: GharSathi_React/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: GharSathi_React
        run: |
          npm ci || npm install

      - name: Run Vitest Component Test Suite
        working-directory: GharSathi_React
        run: |
          npm run test

      - name: Build Vite Production Assets (Verify 0 Errors)
        working-directory: GharSathi_React
        run: |
          npm run build

  # ============================================================================
  # 3. Docker Containerization Build Validation
  # ============================================================================
  docker-compose-build:
    name: Docker Compose Build Verification
    needs: [backend-test, frontend-build-and-test]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Containers
        run: |
          docker compose build --parallel
